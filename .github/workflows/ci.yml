name: CI

# Só em pull requests: a main só recebe código por PR (ADR-008), e assim o CI não roda duas vezes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Variáveis do ambiente local
        run: cp .env.example .env
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes unitários com cobertura (meta do TST-01)
        run: npm run test:cov
      - name: Resumo da cobertura
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;const l=k=>'| '+k+' | '+t[k].pct+'% | '+t[k].covered+'/'+t[k].total+' |';console.log(['### Cobertura dos testes unitários','','| Métrica | % | Cobertos |','|---|---|---|',l('lines'),l('statements'),l('functions'),l('branches')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov-report
          retention-days: 14
      - name: Testes de integração e de API (banco descartável com Testcontainers)
        run: npm run test:e2e
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
