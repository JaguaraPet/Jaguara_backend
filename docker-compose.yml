name: jaguara

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaguara
      POSTGRES_PASSWORD: jaguara
      POSTGRES_DB: jaguara
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jaguara -d jaguara']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
